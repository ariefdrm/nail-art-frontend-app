openapi: 3.0.3
info:
  title: The Nail Palace Booking API
  version: 1.0.0
  description: |
    Kontrak API backend sistem reservasi The Nail Palace (studio nail art, Kota Jambi).
    Konvensi: JSON, snake_case, waktu ISO 8601 dengan offset +07:00 (WIB), harga dalam Rupiah (integer),
    nomor telepon format E.164 (+62...).
servers:
  - url: http://localhost:3000/api/v1
    description: Development
tags:
  - name: Public
    description: Endpoint untuk customer (tanpa login)
  - name: Auth
    description: Autentikasi admin
  - name: Admin
    description: Endpoint untuk pemilik/admin (wajib token)

paths:
  /services:
    get:
      tags: [Public]
      summary: Daftar layanan aktif
      parameters:
        - { name: category, in: query, schema: { type: string, example: gel_polish } }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Service' } }
  /services/{id}:
    get:
      tags: [Public]
      summary: Detail layanan
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Service' }
        '404': { $ref: '#/components/responses/NotFound' }
  /artists:
    get:
      tags: [Public]
      summary: Daftar nail artist aktif
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Artist' } }
  /availability:
    get:
      tags: [Public]
      summary: Slot waktu yang tersedia pada satu tanggal
      description: |
        Jika artist_id tidak diisi, slot dikembalikan beserta daftar artist yang tersedia pada slot tersebut.
        Tanggal (WIB) tidak boleh sebelum hari ini dan tidak boleh melebihi MAX_ADVANCE_DAYS (422).
        Hari tutup mengembalikan slots kosong; pada hari ini, slot yang waktu mulainya sudah lewat tidak ditampilkan.
        service_id atau artist_id yang tidak ada atau tidak aktif mengembalikan 404.
        Setiap reservasi aktif menempati artist-nya sampai end_at ditambah BOOKING_BUFFER_MINUTES (jeda antar-reservasi);
        blokir waktu, jam istirahat, dan jam tutup tidak memakai jeda.
      parameters:
        - { name: service_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: query, required: true, schema: { type: string, format: date, example: '2026-11-10' } }
        - { name: artist_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Availability' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /bookings:
    post:
      tags: [Public]
      summary: Buat reservasi
      description: |
        Tanpa akun. Status awal pending. Jika artist_id kosong, sistem memilih artist yang tersedia pada slot tersebut.
        start_at harus salah satu slot dari GET /availability; selain itu 409 SLOT_UNAVAILABLE. Tanggal di masa lalu atau
        melebihi MAX_ADVANCE_DAYS ditolak 422. Nomor telepon diterima dalam bentuk 08..., 62..., atau +62... dan disimpan
        sebagai E.164. Harga disalin dari layanan saat reservasi dibuat.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingCreate' }
      responses:
        '429': { $ref: '#/components/responses/RateLimited' }
        '201':
          description: Reservasi dibuat (status awal pending)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Booking' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SlotUnavailable' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /bookings/{booking_code}:
    get:
      tags: [Public]
      summary: Cek status reservasi (kode booking + nomor telepon)
      parameters:
        - { name: booking_code, in: path, required: true, schema: { type: string, example: NP-20261110-A7K2 } }
        - { name: phone, in: query, required: true, schema: { type: string, example: '+6281234567890' } }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Booking' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bookings/{booking_code}/cancel:
    patch:
      tags: [Public]
      summary: Batalkan reservasi oleh customer
      parameters:
        - { name: booking_code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: '+6281234567890' }
                reason: { type: string, maxLength: 255 }
      responses:
        '429': { $ref: '#/components/responses/RateLimited' }
        '200':
          description: Dibatalkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Booking' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Status tidak dapat dibatalkan, atau sudah lewat batas waktu pembatalan (INVALID_STATUS_TRANSITION)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Perbarui access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (cabut refresh token)
      description: |
        Mencabut refresh token yang dikirim sehingga tidak bisa dipakai lagi di `/auth/refresh`.
        Idempoten: token yang tidak dikenal atau sudah dicabut tetap dijawab 204, agar tidak
        membocorkan apakah token itu valid. Tidak butuh access token (access token klien yang
        sedang logout sering sudah kedaluwarsa). Hanya sesi dengan token ini yang berakhir; sesi di
        perangkat lain tetap aktif. Access token yang sudah terbit tetap berlaku sampai kedaluwarsa
        (maksimal 15 menit).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '204': { description: Sesi berakhir }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Logout dari semua perangkat
      description: |
        Mencabut semua refresh token milik admin yang sedang login (misalnya setelah perangkat hilang).
        Access token yang sudah terbit tetap berlaku sampai kedaluwarsa (maksimal 15 menit).
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Semua sesi berakhir }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Profil admin yang sedang login
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Admin' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/bookings:
    get:
      tags: [Admin]
      summary: Daftar reservasi (untuk dashboard jadwal)
      description: |
        Diurutkan menurut start_at naik. date_from/date_to (WIB, inklusif) menyaring berdasarkan start_at;
        date_from tidak boleh setelah date_to (422). q mencari nama, nomor telepon (08..., 62..., atau +62...) dan kode booking.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/BookingStatus' } }
        - { name: artist_id, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, description: Cari nama/telepon/kode, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Booking' } }
                  meta: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Admin]
      summary: Buat reservasi manual (walk-in / dari chat)
      description: |
        Status langsung confirmed dan source admin. Aturan slot, jeda, dan blokir waktu sama dengan reservasi online:
        start_at harus salah satu slot dari GET /availability. artist_id kosong = sistem memilih artist yang tersedia.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingCreate' }
      responses:
        '201':
          description: Dibuat (status langsung confirmed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SlotUnavailable' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/bookings/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Admin]
      summary: Detail reservasi
      description: Menyertakan reminder_url (tautan wa.me dengan pesan pengingat siap kirim) untuk reservasi pending/confirmed.
      security: [{ bearerAuth: [] }]
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin]
      summary: Jadwal ulang / ubah data reservasi
      description: |
        Minimal satu field. Mengubah start_at, artist_id, atau service_id hanya untuk reservasi pending/confirmed
        (selain itu 409 INVALID_STATUS_TRANSITION) dan harus tetap berupa slot yang tersedia (aturan sama dengan reservasi baru,
        reservasi ini sendiri tidak dihitung sebagai penghalang); gagal = 409 SLOT_UNAVAILABLE. Bila hanya start_at atau service_id
        berubah, artist tetap. Mengganti layanan menyalin ulang harga layanan baru ke total_price. customer_note dan admin_note
        dapat diubah pada status apa pun; string kosong menghapus catatan.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                start_at: { type: string, format: date-time }
                artist_id: { type: string, format: uuid }
                service_id: { type: string, format: uuid }
                customer_note: { type: string, maxLength: 500 }
                admin_note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Slot tidak tersedia (SLOT_UNAVAILABLE) atau status tidak mengizinkan jadwal ulang (INVALID_STATUS_TRANSITION)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/bookings/{id}/status:
    patch:
      tags: [Admin]
      summary: Ubah status reservasi
      description: |
        Transisi yang diizinkan: pending → confirmed | cancelled; confirmed → completed | cancelled | no_show.
        completed, cancelled, dan no_show adalah status akhir. completed dan no_show hanya setelah waktu mulai reservasi
        (status itu melepas slot, jadi tidak boleh diberikan sebelum jadwal berjalan). cancelled wajib menyertakan reason (422).
        Setiap perubahan tercatat di riwayat status dengan admin yang melakukannya.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/BookingStatus' }
                reason: { type: string, maxLength: 255, description: Wajib untuk cancelled }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Transisi status tidak valid (INVALID_STATUS_TRANSITION)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/services:
    get:
      tags: [Admin]
      summary: Daftar semua layanan (termasuk nonaktif)
      security: [{ bearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Service' } }
    post:
      tags: [Admin]
      summary: Tambah layanan
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Service' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/services/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    put:
      tags: [Admin]
      summary: Ubah layanan
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceInput' }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Service' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      summary: Hapus layanan (soft delete / nonaktifkan jika sudah punya reservasi)
      security: [{ bearerAuth: [] }]
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '204': { description: Dihapus }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/artists:
    get:
      tags: [Admin]
      summary: Daftar semua nail artist
      security: [{ bearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Artist' } }
    post:
      tags: [Admin]
      summary: Tambah nail artist
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtistInput' }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Artist' }
  /admin/artists/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    put:
      tags: [Admin]
      summary: Ubah nail artist
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtistInput' }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Artist' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      summary: Nonaktifkan nail artist
      security: [{ bearerAuth: [] }]
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '204': { description: Dinonaktifkan }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/business-hours:
    get:
      tags: [Admin]
      summary: Jam operasional mingguan
      description: Satu baris per hari (0 = Minggu sampai 6 = Sabtu), diurutkan menurut hari.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/BusinessHour' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Admin]
      summary: Ganti seluruh jam operasional mingguan
      description: |
        Wajib memuat tepat 7 hari (0 sampai 6, tanpa duplikat); perubahan bersifat atomik.
        Hari buka wajib punya `open_time` lebih awal dari `close_time`. Jam istirahat bersifat opsional,
        harus diisi berpasangan, dan berada di dalam jam buka. Hari tutup disimpan tanpa jam.
        Jam baru hanya berlaku untuk slot ke depan; reservasi yang sudah ada tidak berubah.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hours]
              properties:
                hours:
                  type: array
                  minItems: 7
                  maxItems: 7
                  items: { $ref: '#/components/schemas/BusinessHour' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/BusinessHour' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/blocked-slots:
    get:
      tags: [Admin]
      summary: Daftar waktu yang diblokir (libur, istirahat, cuti artist)
      description: Memuat blokir yang beririsan dengan rentang tanggal (zona waktu Asia/Jakarta), diurutkan menurut waktu mulai.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/BlockedSlot' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Admin]
      summary: Blokir rentang waktu
      description: |
        Boleh memblokir waktu yang sudah berisi reservasi `pending` atau `confirmed`, tetapi harus lewat
        langkah sadar: jika ada reservasi yang bertabrakan dan `acknowledge_conflicts` bukan `true`,
        permintaan ditolak `409 BLOCK_HAS_BOOKINGS` beserta daftar reservasinya dan tidak ada yang dibuat.
        Dengan `acknowledge_conflicts: true`, blokir dibuat dan reservasi yang terdampak dikembalikan di
        `affected_bookings`. Sistem tidak membatalkan reservasi apa pun; pemilik menyepakati jadwal ulang
        atau pembatalan dengan customer lewat chat (`contact_url`) lalu mencatatnya.
        Blokir tanpa `artist_id` berlaku untuk seluruh studio (bertabrakan dengan reservasi semua artist).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlockedSlotInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BlockedSlotCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/BlockHasBookings' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/blocked-slots/check:
    post:
      tags: [Admin]
      summary: Periksa reservasi yang terdampak sebelum memblokir
      description: Tidak menyimpan apa pun. `acknowledge_conflicts` pada body diabaikan.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlockedSlotInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BlockCheck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/blocked-slots/{id}:
    delete:
      tags: [Admin]
      summary: Hapus blokir
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '204': { description: Dihapus }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/dashboard/summary:
    get:
      tags: [Admin]
      summary: Ringkasan dashboard (indikator keberhasilan)
      description: |
        Semua angka dihitung dari reservasi yang start_at-nya jatuh pada rentang tanggal (WIB, date_from dan date_to inklusif),
        semua status ikut dihitung kecuali disebutkan lain. date_to tidak boleh sebelum date_from dan rentang maksimal 366 hari (422).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: date_from, in: query, required: true, schema: { type: string, format: date } }
        - { name: date_to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DashboardSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/export/bookings.csv:
    get:
      tags: [Admin]
      summary: Ekspor reservasi ke CSV (untuk tim data science)
      description: |
        Hanya role owner. Satu baris per reservasi, diurutkan menurut start_at naik, dikirim bertahap (streaming).
        date_from/date_to (WIB, inklusif, berdasarkan start_at) bersifat opsional; tanpa keduanya seluruh reservasi diekspor.
        Format: UTF-8 tanpa BOM, pemisah koma, akhir baris CRLF (RFC 4180), baris pertama adalah nama kolom, waktu dalam
        ISO 8601 +07:00, nilai kosong untuk data yang tidak ada, boolean true/false. Sel teks yang diawali = + - @ diberi
        awalan tanda petik tunggal agar tidak dibaca sebagai rumus oleh aplikasi spreadsheet.

        Data pribadi tidak diekspor: tidak ada nama, nomor telepon, kode booking, maupun catatan bebas. Customer yang sama
        dikenali lewat customer_ref, yaitu HMAC-SHA256 nomor telepon (16 karakter heksadesimal pertama) dengan kunci rahasia
        server; nilainya stabil selama JWT_REFRESH_SECRET tidak diganti, dan tidak bisa dibalik menjadi nomor telepon.

        Kolom: booking_id, status, source, service_id, service_name, service_category, artist_id, start_at, end_at,
        duration_minutes, total_price, created_at, confirmed_at, lead_time_hours (jam dari dibuat sampai mulai),
        confirmation_minutes (menit dari dibuat sampai dikonfirmasi), has_reference_image, has_customer_note, customer_ref,
        status_changes (jumlah perubahan status), last_status_change_at, cancelled_by (customer, admin, atau kosong; customer
        juga mencakup perubahan oleh sistem tanpa admin).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/BookingStatus' } }
      responses:
        '200':
          description: File CSV
          headers:
            Content-Disposition: { schema: { type: string, example: 'attachment; filename="bookings_2026-03-01_2026-03-31.csv"' } }
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/notifications:
    get:
      tags: [Admin]
      summary: Kotak masuk notifikasi admin
      description: |
        Notifikasi 30 hari terakhir, terbaru lebih dulu. Status baca disimpan per admin: membaca notifikasi tidak
        mengubah status baca admin lain. unread=true hanya menampilkan yang belum dibaca oleh admin yang sedang login.
        Teks notifikasi memuat kode booking, layanan, waktu, dan nama depan customer saja, tanpa nomor telepon.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: unread, in: query, schema: { type: boolean, default: false } }
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  meta: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/notifications/unread-count:
    get:
      tags: [Admin]
      summary: Jumlah notifikasi yang belum dibaca admin yang sedang login
      description: Ringan, untuk dipanggil berkala oleh frontend (polling) guna menampilkan lencana.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      unread: { type: integer, example: 3 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/notifications/read-all:
    post:
      tags: [Admin]
      summary: Tandai semua notifikasi sebagai sudah dibaca (untuk admin yang sedang login)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      marked: { type: integer, description: Jumlah notifikasi yang baru ditandai }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/notifications/{id}/read:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    patch:
      tags: [Admin]
      summary: Tandai satu notifikasi sebagai sudah dibaca (idempoten)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/push/public-key:
    get:
      tags: [Admin]
      summary: Kunci publik VAPID untuk berlangganan Web Push
      description: |
        Dipakai browser pada pushManager.subscribe({ applicationServerKey }). Mengembalikan 404 bila Web Push belum
        dikonfigurasi di server (VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, dan VAPID_SUBJECT belum diisi).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      public_key: { type: string, description: Kunci publik VAPID (base64url) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/push-subscriptions:
    post:
      tags: [Admin]
      summary: Daftarkan perangkat/browser untuk menerima notifikasi Web Push
      description: |
        Body adalah hasil PushSubscription.toJSON() dari browser. Idempoten menurut endpoint: mendaftarkan endpoint yang
        sama lagi memperbarui kuncinya dan memindahkannya ke admin yang sedang login (mis. perangkat dipakai bergantian).
        Endpoint harus https dan milik layanan push browser yang dikenal (Chrome/FCM, Firefox, Safari, Edge); selain itu 422.
        201 untuk langganan baru, 200 bila endpoint sudah terdaftar. 404 bila Web Push belum dikonfigurasi.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscriptionInput' }
      responses:
        '200':
          description: Endpoint sudah terdaftar; kunci diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PushSubscription' }
        '201':
          description: Langganan baru
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PushSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin]
      summary: Berhenti berlangganan Web Push untuk perangkat ini
      description: Menghapus langganan milik admin yang sedang login dengan endpoint tersebut. Idempoten (204 walau tidak ada).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri }
      responses:
        '204': { description: Dihapus }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Forbidden:
      description: Role admin tidak memiliki akses ke endpoint ini
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: FORBIDDEN, message: Anda tidak memiliki akses } }
    RateLimited:
      description: |
        Terlalu banyak permintaan dari alamat IP yang sama (RATE_LIMITED). Tunggu sesuai header Retry-After.
        Semua respons endpoint /api/v1 menyertakan header RateLimit-Limit, RateLimit-Remaining, dan RateLimit-Reset.
      headers:
        Retry-After: { schema: { type: integer }, description: Detik sampai batas direset }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: RATE_LIMITED, message: 'Terlalu banyak permintaan, coba lagi nanti' } }
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: NOT_FOUND, message: Data tidak ditemukan } }
    Unauthorized:
      description: Token tidak ada/tidak valid atau kredensial salah
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: UNAUTHORIZED, message: Email atau password salah } }
    ValidationError:
      description: Input tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: VALIDATION_ERROR
              message: Input tidak valid
              details:
                - { field: customer_phone, message: Format nomor telepon tidak valid }
    SlotUnavailable:
      description: Slot sudah terisi atau diblokir
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: SLOT_UNAVAILABLE, message: Jadwal yang dipilih sudah tidak tersedia } }
    BlockHasBookings:
      description: Ada reservasi aktif pada rentang yang diblokir dan acknowledge_conflicts belum true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: BLOCK_HAS_BOOKINGS
              message: Ada reservasi pada waktu yang akan diblokir
              conflicts:
                - id: 6f1f7f0e-9a53-4f4e-8c1c-1c8f6b0f1a11
                  booking_code: NP-20261110-A7K2
                  status: confirmed
                  start_at: '2026-11-10T10:00:00+07:00'
                  end_at: '2026-11-10T11:30:00+07:00'
                  customer_name: Siti
                  service_name: Gel Polish
                  contact_url: https://wa.me/6281234567890?text=Halo%20Siti
  schemas:
    BookingStatus:
      type: string
      enum: [pending, confirmed, completed, cancelled, no_show]
    Service:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Gel Polish + Nail Art Simple }
        description: { type: string, nullable: true }
        category: { type: string, example: gel_polish }
        price: { type: integer, example: 150000, description: Rupiah }
        duration_minutes: { type: integer, example: 90 }
        image_url: { type: string, nullable: true }
        is_active: { type: boolean }
    ServiceInput:
      type: object
      required: [name, category, price, duration_minutes]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        category: { type: string, minLength: 1, maxLength: 50 }
        price: { type: integer, minimum: 0, maximum: 100000000, description: Rupiah }
        duration_minutes: { type: integer, minimum: 15, maximum: 480, multipleOf: 15 }
        image_url: { type: string, format: uri, maxLength: 2048, nullable: true, description: URL http atau https }
        is_active: { type: boolean, default: true }
    Artist:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        photo_url: { type: string, nullable: true }
        is_active: { type: boolean }
    ArtistInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        photo_url: { type: string, format: uri, maxLength: 2048, nullable: true, description: URL http atau https }
        is_active: { type: boolean, default: true }
    Slot:
      type: object
      properties:
        start_at: { type: string, format: date-time, example: '2026-11-10T10:00:00+07:00' }
        end_at: { type: string, format: date-time, example: '2026-11-10T11:30:00+07:00' }
        available_artist_ids:
          type: array
          items: { type: string, format: uuid }
    Availability:
      type: object
      properties:
        date: { type: string, format: date }
        service_id: { type: string, format: uuid }
        slots: { type: array, items: { $ref: '#/components/schemas/Slot' } }
    BookingCreate:
      type: object
      required: [service_id, start_at, customer_name, customer_phone]
      properties:
        service_id: { type: string, format: uuid }
        artist_id: { type: string, format: uuid, nullable: true, description: Kosong = sistem memilih artist yang tersedia }
        start_at: { type: string, format: date-time }
        customer_name: { type: string, maxLength: 100 }
        customer_phone: { type: string, example: '+6281234567890', description: 'Format 08..., 62..., atau +62...; disimpan sebagai E.164' }
        customer_note: { type: string, maxLength: 500 }
        reference_image_url: { type: string, nullable: true }
    Booking:
      type: object
      properties:
        id: { type: string, format: uuid }
        booking_code: { type: string, example: NP-20261110-A7K2 }
        status: { $ref: '#/components/schemas/BookingStatus' }
        service: { $ref: '#/components/schemas/Service' }
        artist: { $ref: '#/components/schemas/Artist' }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        customer_name: { type: string }
        customer_phone: { type: string }
        customer_note: { type: string, nullable: true }
        reference_image_url: { type: string, nullable: true }
        total_price: { type: integer }
        source: { type: string, enum: [online, admin] }
        cancel_reason: { type: string, nullable: true }
        admin_note: { type: string, nullable: true }
        reminder_url: { type: string, nullable: true, description: 'Hanya pada respons admin. Tautan wa.me dengan pesan pengingat; null bila status bukan pending/confirmed' }
        schedule_conflict: { type: boolean, description: 'true bila reservasi aktif bertabrakan dengan blokir waktu; pemilik akan menghubungi customer' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BusinessHour:
      type: object
      required: [day_of_week, is_open]
      properties:
        day_of_week: { type: integer, minimum: 0, maximum: 6, description: '0 = Minggu ... 6 = Sabtu' }
        is_open: { type: boolean }
        open_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '10:00', nullable: true }
        close_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '20:00', nullable: true }
        break_start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '12:00', nullable: true, description: Opsional; harus berpasangan dengan break_end }
        break_end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '13:00', nullable: true }
    BlockedSlot:
      type: object
      properties:
        id: { type: string, format: uuid }
        artist_id: { type: string, format: uuid, nullable: true, description: null = seluruh studio }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        reason: { type: string, nullable: true }
    BlockedSlotInput:
      type: object
      required: [start_at, end_at]
      properties:
        artist_id: { type: string, format: uuid, nullable: true, description: Kosong = seluruh studio }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time, description: Harus setelah start_at; rentang maksimal 366 hari }
        reason: { type: string, maxLength: 255 }
        acknowledge_conflicts: { type: boolean, default: false, description: Wajib true untuk memblokir waktu yang berisi reservasi aktif }
    AffectedBooking:
      type: object
      properties:
        id: { type: string, format: uuid }
        booking_code: { type: string, example: NP-20261110-A7K2 }
        status: { $ref: '#/components/schemas/BookingStatus' }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        customer_name: { type: string }
        service_name: { type: string }
        contact_url: { type: string, format: uri, description: Tautan wa.me dengan pesan siap kirim; pemilik menekan kirim sendiri }
    BlockedSlotCreated:
      allOf:
        - { $ref: '#/components/schemas/BlockedSlot' }
        - type: object
          properties:
            affected_bookings: { type: array, items: { $ref: '#/components/schemas/AffectedBooking' } }
    BlockCheck:
      type: object
      properties:
        can_block: { type: boolean, description: true bila tidak ada reservasi aktif yang bertabrakan }
        conflicts: { type: array, items: { $ref: '#/components/schemas/AffectedBooking' } }
    Admin:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, staff] }
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 900, description: Detik }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [new_booking, booking_cancelled, unconfirmed_reminder, upcoming_reminder, schedule_conflict]
          description: |
            new_booking = reservasi baru dari customer; booking_cancelled = dibatalkan customer;
            unconfirmed_reminder = pending terlalu lama; upcoming_reminder = reservasi confirmed segera dimulai;
            schedule_conflict = reservasi aktif bertabrakan dengan blokir waktu
        title: { type: string, example: Reservasi baru }
        body: { type: string, example: 'Siti memesan Gel Polish pada Selasa, 10 November 2026 pukul 10.00 WIB (NP-20261110-A7K2).' }
        booking_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        read: { type: boolean, description: Sudah dibaca oleh admin yang sedang login }
        read_at: { type: string, format: date-time, nullable: true }
    PushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri, example: 'https://fcm.googleapis.com/fcm/send/abc' }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, description: Kunci publik klien (base64url) }
            auth: { type: string, description: Rahasia autentikasi (base64url) }
    PushSubscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    DashboardSummary:
      type: object
      properties:
        period: { type: object, properties: { date_from: { type: string, format: date }, date_to: { type: string, format: date } } }
        total_bookings: { type: integer, description: Semua reservasi pada periode, apa pun statusnya }
        by_status:
          type: object
          properties:
            pending: { type: integer }
            confirmed: { type: integer }
            completed: { type: integer }
            cancelled: { type: integer }
            no_show: { type: integer }
        no_show_rate: { type: number, nullable: true, example: 0.08, description: 'no_show / (completed + no_show), 0..1; null bila belum ada reservasi completed atau no_show' }
        online_booking_ratio: { type: number, nullable: true, example: 0.75, description: 'Reservasi dengan source online / total_bookings, 0..1; null bila total_bookings = 0' }
        revenue_completed: { type: integer, description: 'Jumlah total_price reservasi completed, dalam Rupiah' }
        avg_confirmation_minutes: { type: number, nullable: true, description: 'Rata-rata menit dari dibuat sampai dikonfirmasi, hanya reservasi online yang pernah dikonfirmasi (reservasi admin langsung confirmed sehingga tidak dihitung); null bila belum ada' }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
            conflicts:
              type: array
              description: Hanya untuk BLOCK_HAS_BOOKINGS
              items: { $ref: '#/components/schemas/AffectedBooking' }
