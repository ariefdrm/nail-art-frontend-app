name: frontend-nail-art-app

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development

    image: localhost/frontend-nail-art-app:dev
    container_name: frontend-nail-art-app
    working_dir: /app

    ports:
      - "5173:3000"

    volumes:
      # Mount source code for live editing
      - .:/app

      # Keep node_modules accessible on the host
      - ./node_modules:/app/node_modules

    command: sh -c "bun install && bun run dev --host 0.0.0.0"

    init: true
